services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: feetflow-server
    ports:
      - "5180:5180"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db.tachyontracer.in;Port=5432;Database=odoo;Username=odoo;Password=sQRM59Emcm5A7e6
      - RabbitMq__HostName=rabbitmq.tachyontracer.in
      - Jwt__SecretKey=REPLACE_WITH_SECURE_KEY_AT_LEAST_32_CHARACTERS
      - Jwt__Issuer=https://fleetflow.tachyontracer.in
      - Jwt__Audience=https://fleetflow.tachyontracer.in
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5180/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: feetflow-client
    ports:
      - "4200:80"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
