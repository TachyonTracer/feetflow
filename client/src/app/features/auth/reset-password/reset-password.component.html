<div class="col-lg-10" style="text-align: center;">
  <h1 id="title" class="title">Call Manager</h1>
  <hr>
  <p class="text-danger">Your password has expired! Please create your a new one.</p>
</div>

<form #resetPasswordForm="ngForm" aria-labelledby="title">
  <div class="col-lg-10 col-md-10 col-sm-12">
    <div class="form-control-group">
      <label class="label" for="inputNewPassword">New Password:</label>
      <input class="form-control" [(ngModel)]="resetPasswordNgModel.password" name="inputNewPassword" type="password"
        id="inputNewPassword" placeholder="Enter New Password" minlength="6" maxlength="35" required>
    </div>
  </div>
  <div class="col-lg-10 col-md-10 col-sm-12">
    <div class="form-control-group">
      <label class="label" for="inputNewConfirmPassword">Confirm New Password:</label>
      <input class="form-control" [(ngModel)]="resetPasswordNgModel.confirmPassword" name="inputNewConfirmPassword"
        type="password" id="inputNewConfirmPassword" placeholder="Enter Confirm New Password" required>
    </div>
  </div>
  <div class="col-lg-10">
    <div>
      <button class="btn btn-primary" (click)="resetPassword()"
        [disabled]="!resetPasswordForm.valid || resetPasswordNgModel.password !== resetPasswordNgModel.confirmPassword">
        Reset Password
      </button>
    </div>
  </div>
</form>
