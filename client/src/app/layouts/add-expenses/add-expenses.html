<div class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <div class="title-row">
                <span class="material-symbols-outlined title-icon">receipt_long</span>
                <h2 class="modal-title">New Fuel Expense</h2>
            </div>
            <button class="modal-close-btn" aria-label="Close modal" (click)="closeModal()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="modal-body">
            <p class="subtitle">Enter the details for fleet fuel costs below to update the system.</p>

            <form class="expense-form" (ngSubmit)="submitExpense()">
                <div class="hero-image-container">
                    <div class="hero-overlay"></div>
                    <div class="hero-text">
                        <span class="hero-label">Operational Tracking</span>
                        <h3 class="hero-title">Fuel Expense Registration</h3>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="vehicle-select">
                            <span class="material-symbols-outlined label-icon">local_shipping</span>
                            Vehicle
                        </label>
                        <div class="input-wrapper">
                            <select class="form-control form-select" id="vehicle-select" name="vehicleId"
                                [(ngModel)]="formData.vehicleId" required>
                                <option value="" disabled>Select a vehicle</option>
                                <option *ngFor="let v of vehicles" [value]="v.id">
                                    {{ v.name }} - {{ v.licensePlate }}
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fuel-date">
                            <span class="material-symbols-outlined label-icon">calendar_today</span>
                            Fuel Date
                        </label>
                        <div class="input-wrapper">
                            <input class="form-control" id="fuel-date" type="date" name="fuelDate"
                                [(ngModel)]="formData.fuelDate" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="liters">
                            <span class="material-symbols-outlined label-icon">local_gas_station</span>
                            Liters
                        </label>
                        <div class="input-wrapper">
                            <input class="form-control pr-input" id="liters" placeholder="0.00" step="0.01"
                                type="number" name="liters" [(ngModel)]="formData.liters" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fuel-cost">
                            <span class="material-symbols-outlined label-icon">payments</span>
                            Fuel Cost
                        </label>
                        <div class="input-wrapper has-prefix">
                            <span class="input-prefix">$</span>
                            <input class="form-control pr-input" id="fuel-cost" placeholder="0.00" step="0.01"
                                type="number" name="cost" [(ngModel)]="formData.cost" required />
                        </div>
                    </div>
                </div>

                <div class="form-group mt-large">
                    <label class="form-label" for="notes">
                        <span class="material-symbols-outlined label-icon">description</span>
                        Notes (Optional)
                    </label>
                    <textarea class="form-control form-textarea" id="notes"
                        placeholder="Add any specific details about the expenses..." rows="3" name="notes"
                        [(ngModel)]="notes"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-cancel" type="button" (click)="closeModal()">Cancel</button>
                    <button class="btn-primary" type="submit" [disabled]="isSubmitting">
                        <span class="material-symbols-outlined btn-icon">add_circle</span>
                        {{ isSubmitting ? 'Creating...' : 'Create Expense' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
