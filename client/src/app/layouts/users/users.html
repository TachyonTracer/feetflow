<app-data-page-layout pageTitle="User Management" pageSubtitle="Manage application users, roles, and lifecycle actions."
    [searchPlaceholder]="'Search users by name, email, or role...'" [searchTerm]="searchTerm"
    (searchTermChange)="searchTerm = $event; onFiltersChanged()" [filterOptions]="roleOptions"
    [filterValue]="currentRole" (filterChange)="currentRole = $event; onFiltersChanged()" [sortOptions]="sortOptions"
    [sortValue]="sortBy" (sortChange)="sortBy = $event; onFiltersChanged()" [columns]="columns" [data]="paginatedUsers"
    [isLoading]="isLoading()" recordLabel="users" emptyMessage="There are currently no users in the system."
    [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" (pageSizeChange)="onPageSizeChanged($event)"
    [pageNumber]="pageNumber" [totalPages]="totalPages" [totalCount]="totalCount" (pageChange)="changePage($event)">
    <!-- Custom Cell Rendering -->
    <ng-template appCustomCell let-row let-col="column">
        @switch (col.key) {
        @case ('fullName') {
        <span class="font-weight-bold">{{ row.fullName }}</span>
        }
        @case ('actions') {
        <div class="action-group">
            <button class="action-icon-button" (click)="openEditForm(row)" title="Edit User">
                <span class="material-symbols-outlined">edit_square</span>
            </button>
            <button class="action-icon-button danger" (click)="deleteUser(row.userId)" title="Delete User">
                <span class="material-symbols-outlined">delete</span>
            </button>
        </div>
        }
        }
    </ng-template>

    <!-- Modals -->
    <ng-container extraContent>
        @if (editingUserId()) {
        <div class="modal-overlay" (click)="cancelForm()">
            <div class="modal-container" (click)="$event.stopPropagation()">
                <div class="modal-header">
                    <h2 class="modal-title">Edit User Profile</h2>
                    <button class="modal-close-btn" (click)="cancelForm()">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="error-banner" *ngIf="errorMessage()">
                        {{ errorMessage() }}
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name <span class="required">*</span></label>
                        <input type="text" [(ngModel)]="userForm().fullName" class="form-input"
                            placeholder="Enter full name" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <app-searchable-select [options]="roleOptions"
                            [(ngModel)]="userForm().role"></app-searchable-select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="button-primary" (click)="saveEditedUser()"
                        [disabled]="isLoading() || !userForm().fullName">
                        <span class="material-symbols-outlined icon-small">save</span>
                        Update User
                    </button>
                    <button class="button-secondary" (click)="cancelForm()">Cancel</button>
                </div>
            </div>
        </div>
        }
    </ng-container>
</app-data-page-layout>
