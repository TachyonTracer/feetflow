<div class="user-management-layout">
    <app-header></app-header>
    <main class="user-management-container">
        <div class="header-section">
            <h1>User Management</h1>
        </div>

        <div class="error-banner" *ngIf="errorMessage()">
            {{ errorMessage() }}
        </div>

        <div class="form-panel card" *ngIf="editingUserId()">
            <h3>Edit User</h3>

            <div class="form-group">
                <label for="userName">Full Name *</label>
                <input id="userName" type="text" [(ngModel)]="userForm().fullName" class="form-control"
                    placeholder="Enter full name" required />
            </div>

            <div class="form-group mt-3">
                <label for="userRole">Role</label>
                <select id="userRole" [(ngModel)]="userForm().role" class="form-control">
                    <option value="Manager">Manager</option>
                    <option value="Dispatcher">Dispatcher</option>
                    <option value="SafetyOfficer">Safety Officer</option>
                    <option value="FinancialAnalyst">Financial Analyst</option>
                </select>
            </div>

            <div class="form-actions mt-4">
                <button class="btn btn-secondary mr-2" (click)="cancelForm()">Cancel</button>
                <button class="btn btn-success" (click)="saveEditedUser()"
                    [disabled]="isLoading() || !userForm().fullName">
                    Update User
                </button>
            </div>
        </div>

        <div class="loading-state" *ngIf="isLoading()">
            <p>Processing data, please wait...</p>
        </div>

        <div class="table-container mt-4" *ngIf="!isLoading() && !editingUserId()">
            <table class="table table-striped custom-table" *ngIf="users().length > 0; else emptyState">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Joined</th>
                        <th class="actions-col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users()">
                        <td class="font-weight-bold">{{ user.fullName }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.role }}</td>
                        <td class="text-muted">{{ user.createdAt | date:'mediumDate' }}</td>
                        <td class="actions-col">
                            <button class="btn btn-sm btn-outline-primary" (click)="openEditForm(user)">Edit</button>
                            <button class="btn btn-sm btn-outline-danger ml-2"
                                (click)="deleteUser(user.userId)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <ng-template #emptyState>
                <div class="empty-state text-center mt-5">
                    <h4>No Users Found</h4>
                    <p class="text-muted">There are currently no users in the system.</p>
                </div>
            </ng-template>
        </div>
    </main>
</div>
