<div class="searchable-select" [class.open]="isOpen" [class.disabled]="disabled">
  <button
    class="select-trigger"
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [attr.aria-expanded]="isOpen"
  >
    <span class="trigger-label">{{ selectedOption?.label || placeholder }}</span>
    <span class="material-symbols-outlined trigger-icon">expand_more</span>
  </button>

  <div class="dropdown-panel" *ngIf="isOpen">
    <div class="dropdown-search">
      <span class="material-symbols-outlined">search</span>
      <input
        type="text"
        [ngModel]="searchTerm"
        (ngModelChange)="searchTerm = $event"
        [placeholder]="searchPlaceholder"
      />
    </div>

    <div class="dropdown-options">
      <button
        class="dropdown-option"
        type="button"
        *ngFor="let option of filteredOptions"
        [class.selected]="option.value === value"
        (click)="selectOption(option.value)"
      >
        <span class="option-label">{{ option.label }}</span>
        <span class="material-symbols-outlined" *ngIf="option.value === value">check</span>
      </button>
      <div class="empty-state" *ngIf="filteredOptions.length === 0">No results found</div>
    </div>
  </div>
</div>
